{
  "schema_version": "1.0.0",
  "standard": "SWCIS",
  "seal_before_comparison": true,
  "scope": "Regression governance contract only. Test-project inventories and customer/project identifiers belong in versioned test-suite configuration outside SWCIS.",
  "required_suites": [
    {"suite_type": "representative_regression", "minimum_cases": 1, "inventory_source": "repository test configuration", "selection_policy": "risk-based coverage of affected modules"},
    {"suite_type": "synthetic_negative", "minimum_cases": 1, "inventory_source": "repository test configuration", "selection_policy": "at least one destructive or fail-closed case for each changed contract"}
  ],
  "required_case_categories": ["missing_authoritative_input", "dependency_or_route_conflict", "external_data_no_match", "schema_compatibility", "locked_semantic_removal"],
  "concrete_test_inventory_policy": "FORBIDDEN_IN_SWCIS",
  "comparison": {"mode": "blind_then_unseal", "required": ["input_hash", "generator_version", "rulebook_version", "pmm_schema_version", "output_hash", "semantic_diff", "artifact_diff", "strict_score"], "pass": "all risk-selected suites and required categories pass; unavailable required evidence blocks the affected release"}
}
