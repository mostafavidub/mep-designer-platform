{
  "schema_version": "1.0.0",
  "standard": "SWCIS",
  "modules": {
    "rule_book": {"owners": ["engineering", "compliance"], "paths": ["data/rulebook/**", "standards/swcis/rule_traceability_matrix.yaml"], "depends_on": []},
    "pmm": {"owners": ["platform", "engineering"], "paths": ["app/mechanical_basis_contract.py", "app/manifest_contract_v2.py", "standards/projects/**"], "depends_on": ["rule_book"]},
    "questionnaire": {"owners": ["product", "engineering"], "paths": ["templates/**", "static/**", "tests/test_questionnaire_choices.py"], "depends_on": ["pmm", "rule_book"]},
    "planner": {"owners": ["engineering"], "paths": ["cad_engine/*planner*.py", "cad_engine/system_requirements*.py"], "depends_on": ["pmm", "questionnaire"]},
    "cad_designer": {"owners": ["cad", "engineering"], "paths": ["cad_engine/main*.py", "cad_engine/sheet_composer*.py", "app/dxf_output.py"], "depends_on": ["planner"]},
    "routing": {"owners": ["engineering"], "paths": ["cad_engine/routing*.py", "cad_engine/topology*.py", "cad_engine/coordination*.py"], "depends_on": ["planner", "pmm"]},
    "sizing": {"owners": ["engineering"], "paths": ["cad_engine/sizing*.py", "cad_engine/mechanical_calculations*.py", "cad_engine/gas*.py", "cad_engine/water_sanitary*.py", "cad_engine/rainwater*.py", "cad_engine/hvac*.py"], "depends_on": ["routing", "pmm", "rule_book"]},
    "equipment": {"owners": ["engineering"], "paths": ["cad_engine/equipment*.py", "app/fixture*.py"], "depends_on": ["sizing", "pmm"]},
    "manufacturer_selector": {"owners": ["engineering", "data"], "paths": ["cad_engine/manufacturer_selector*.py", "data/manufacturer/**"], "depends_on": ["equipment", "sizing"]},
    "detail_riser": {"owners": ["cad", "engineering"], "paths": ["cad_engine/*detail*.py", "cad_engine/*riser*.py", "cad_engine/parametric_documentation*.py"], "depends_on": ["routing", "sizing", "equipment", "manufacturer_selector"]},
    "qa": {"owners": ["quality", "engineering"], "paths": ["cad_engine/*qa*.py", "cad_engine/*acceptance*.py", "cad_engine/*gate*.py", "tests/**"], "depends_on": ["cad_designer", "routing", "sizing", "equipment", "detail_riser"]},
    "manifest": {"owners": ["platform", "quality"], "paths": ["cad_engine/version_manifest.py", "cad_engine/build_identity.py", "app/*manifest*.py", "standards/active-release.json"], "depends_on": ["pmm", "qa"]},
    "ui_api": {"owners": ["product", "platform"], "paths": ["app/main.py", "app/*.py", "templates/**", "static/**"], "depends_on": ["pmm", "planner", "qa", "manifest"]},
    "docs": {"owners": ["engineering", "product"], "paths": ["docs/**", "README.md"], "depends_on": ["rule_book", "pmm", "qa", "manifest"]},
    "versioning": {"owners": ["release"], "paths": ["standards/swcis/release_contract.yaml", "standards/swcis/version_manifest.yaml", "standards/releases/**", "standards/contract-changelog.json"], "depends_on": ["manifest", "docs"]},
    "migration": {"owners": ["platform", "release"], "paths": ["migrations/**", "standards/swcis/migrations/**", "standards/test-suites/**"], "depends_on": ["pmm", "versioning"]},
    "governance": {"owners": ["quality", "release"], "paths": ["standards/swcis/**", "changes/**", "tools/swcis_*.py", "tools/runtime_version_guard.py", "tests/test_swcis_governance.py", ".github/**", "AGENTS.md"], "depends_on": ["rule_book", "pmm", "questionnaire", "planner", "cad_designer", "routing", "sizing", "equipment", "manufacturer_selector", "detail_riser", "qa", "manifest", "ui_api", "docs", "versioning", "migration"]},
    "deployment": {"owners": ["release", "operations"], "paths": ["Dockerfile", "cad_engine/Dockerfile", "docker-compose*.yml", "start_services.sh", ".github/workflows/**"], "depends_on": ["governance", "versioning", "migration", "qa"]}
  }
}
