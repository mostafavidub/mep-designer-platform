change_id: SWCIS-2026-0044
status: APPROVED
summary: Materialize every workflow-approved equipment or ventilation plan as a distinct CAD board.
reason: Production project 100 approved ten plan deliverables, while the reference-driven compositor emitted only seven and failed the approved-manifest gate.
impact_notes:
  cad_designer: Approved equipment and ventilation plans are emitted as traceable service boards with their approved sheet codes.
  manifest: Approved plan count and generated real-board count remain exactly equal.
  qa: Existing fail-closed board identity, uniqueness, and population checks remain active.
  ui_api: No response schema change.
  migration: No stored-data migration; retrying a preserved failed project applies the correction.
evidence:
  tests:
    - 16 focused plan-contract, topology, and sizing tests pass in the production container.
    - Production project 100 is retried after deployment and must complete with a downloadable artifact.
  rollback: Revert this change; do not weaken the approved-manifest parity gate.
