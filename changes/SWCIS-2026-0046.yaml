change_id: SWCIS-2026-0046
status: APPROVED
summary: Fail closed on non-level frame contamination, degenerate mechanical networks, collapsed equipment, riser contradictions, unsupported calculation facts and unmaterialized details.
reason: User-directed remediation after blind comparison of production projects 102 and 103 showed mixed architectural frames, marker-only water/sanitary networks, duplicate equipment, missing ODU entities, zero-branch risers marked true and calculation/detail inconsistencies.
impact_notes:
  architecture_inference: Detail, section, elevation, parking, slope, lintel and similar support drawings cannot become occupied level authority; slope-only phantom roof profiles are rejected unless independent roof evidence exists.
  cad_designer: Exact generated DXF is reopened and validated after composition; the gate never edits geometry or invents project facts.
  routing_sizing: Marker-only or degenerate primary network geometry is release-blocking rather than presence-valid.
  equipment: IDU without ODU and severe coordinate collapse are release-blocking.
  riser_schedule_detail: Zero branches cannot pass reconciliation; schedule/equipment and detail-register/materialisation mismatches block release.
  calculations: Numeric utility pressure cannot be used when no traceable project pressure answer exists.
  release: A failed generated-artifact integrity gate restores the previous artifact or removes the unreleasable output.
  ui_api: Existing failure status/stage contract is preserved; new stage is generated_dxf_integrity_gate with detailed generated_dxf_integrity_qa evidence.
  migration: No stored-data migration. Existing completed artifacts remain historical; regenerated artifacts must satisfy the new gate.
evidence:
  focused_tests:
    - tests/test_level_detection_v3.py
    - tests/test_mechanical_integrity.py
  blind_regression:
    - project_102_R2_sealed_before_reference
    - project_103_R2_sealed_before_reference
  required_release_verification:
    - full_unit_and_contract_suite
    - SWCIS_impact_and_traceability_gate
    - seven_project_golden_regression
    - production_E2E_upload_questions_design_download
  rollback: Revert this change only if the exact generated-artifact gate is replaced by an equally fail-closed contract; never restore presence-only mechanical release acceptance.
