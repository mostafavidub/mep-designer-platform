{"change_id":"SWCIS-2026-0099","summary":"Bring the Electrical companion, customer workflow, panel recovery, CAD authority and execution-readiness controls to parity with the current Mechanical production architecture using one living, unversioned Electrical runtime.","requester":"mostafavidub","change_types":["drawing_output","ui_api","schema","routing","documentation","runtime","test","governance","deployment"],"changed_rule_ids":[],"impacted_modules":["cad_designer","ui_api","qa","manifest","docs","versioning","migration","governance","deployment","planner","routing","sizing","equipment","manufacturer_selector","detail_riser"],"impact_notes":{"cad_designer":"Adds the single active /design-electrical authority endpoint over the strict evidence-driven Electrical pipeline; no manual release-number routing is used and the CAD image remains independent from web-app modules.","ui_api":"Adds discipline-aware Electrical questions, drawing-set review, exact INPUT_REQUIRED recovery, panel parity and safe workflow status while preserving Mechanical behavior.","qa":"Adds Electrical basis, panel, runtime, authority, release, score, final-file, construction-detail, plan-to-detail, evidence-consistency, submission-titleblock and cross-sheet traceability gates; score >=80 never overrides hard blockers.","manifest":"Electrical sheets are project-driven, explicitly reviewed in the public flow, authorized in the panel flow, and sealed by SHA-256 before CAD execution.","docs":"Defines the Electrical execution/release, construction-detail and submission-quality contracts as a living system; build identity is Git/content-derived rather than manually versioned.","versioning":"Removes Electrical manual runtime/release version locks. Schema/contract revisions identify data contracts only; deployed build identity is commit SHA plus content hash.","migration":"No schema migration is required; existing project answers/analysis are normalized idempotently and preserved.","governance":"Registers the Electrical production path under the same SWCIS impact/governance controls used by Mechanical and classifies the active Electrical runtime paths.","deployment":"Co-built web/CAD deployment is prohibited until dedicated Electrical CI, relevant shared regressions, real raw-project acceptance, construction-detail/reference/visual/reopen/submission QA and release gates pass.","planner":"Adaptive Electrical manifest derives sheet families from levels and applicable systems; no fixed global sheet count.","routing":"Physical routes remain print-frame aware and cross-frame routing is prohibited.","sizing":"Final cable/breaker/voltage-drop/panel values remain fail-closed until evidenced rules/tables and project inputs are supplied.","equipment":"Host-aware Electrical equipment representation and plan/tag traceability are release requirements.","manufacturer_selector":"Manufacturer data can supply final fixture/equipment inputs only when explicitly provided; no implicit selection is introduced.","detail_riser":"Required construction details, plan references and riser/service topology must remain synchronized; placeholder/text-only detail sheets cannot release."},"evidence":{"traceability":["app/electrical_basis_contract.py","app/electrical_rulebook.py","app/electrical_workflow.py","app/electrical_drawing_set.py","app/electrical_review_fix.py","app/electrical_design_integration.py","app/discipline_workflow_dispatcher.py","cad_engine/electrical_api.py","cad_engine/electrical_v1/production.py","cad_engine/electrical_v1/release_contract.py","cad_engine/electrical_v1/runtime_support.py","cad_engine/electrical_v1/construction_qa.py","cad_engine/electrical_v1/submission_quality.py","cad_engine/electrical_v1/acceptance_pipeline.py","cad_engine/electrical_v1/authority_pipeline.py","cad_engine/electrical_v1/postcompose.py"],"tests":["tests/test_electrical_project_driven_v1.py","tests/test_electrical_authority_v15.py","tests/test_electrical_release_gate.py","tests/test_electrical_construction_qa.py","tests/test_electrical_submission_quality.py","tests/test_electrical_basis_contract_v19.py","tests/test_electrical_panel_parity_v19.py","tests/test_electrical_runtime_v19.py","Electrical Project-Driven Tests workflow and relevant shared regressions"],"docs":["docs/ELECTRICAL_V19_EXECUTION_STANDARD.md","docs/ELECTRICAL_CONSTRUCTION_DETAIL_STANDARD.md","docs/ELECTRICAL_SUBMISSION_QUALITY_STANDARD.md","changes/SWCIS-2026-0099.yaml"],"version_bump":["none: Electrical uses one living runtime; contract/schema revisions are not release versions; deployment identity is automatic Git/content build identity"],"migration":["none: additive modules and idempotent normalization over existing JSON answers/analysis"],"golden_regression":["Electrical synthetic authority acceptance plus raw real-project acceptance required before release; construction-detail gates must reject sparse/text-only details, submission gates must reject cross-sheet drift, and project facts remain INPUT_REQUIRED when evidence is absent"],"semantic_diff":["Electrical architecture proxies are PRELIMINARY; project facts and final engineering values require provenance; missing inputs reopen exact questions instead of generic failure; construction details cannot be promoted merely because the DXF reopens; submission metadata never creates engineering facts"],"artifact_diff":["Electrical drawing-set manifest is project-driven and exact delivered DXF must pass same-file reopen/semantic/visual/construction-detail/submission QA with plan-to-detail and cross-sheet reference parity"],"numeric_diff":["No project numeric defaults introduced; execution score topology hard gate is included in engineering-calculation scoring"],"contract_diff":["Adds /design-electrical and /electrical/status; system_health reports separate Electrical CAD and site contracts without a release-number identity; public flow adds explicit Electrical sheet review; CAD release contract requires construction-detail/evidence/submission quality QA"],"deployment_plan":["merge only after CI and real-project gates PASS; deploy web and CAD together; verify build identity/status; run live upload-question-review-design-download-reopen acceptance including construction-detail and submission-quality gates"],"rollback_plan":["revert the protected merge; preserve source, answers, approved manifest and paid-project/revision state; no destructive schema migration"]},"risk":{"likelihood":2,"severity":5,"detectability":2,"score":20,"rationale":"The change activates a new production Electrical path across UI and CAD, but remains isolated by discipline, fail-closed release contracts, dedicated CI, manifest hashing, evidence consistency and exact-file/construction-detail/submission QA."},"waiver":null}
