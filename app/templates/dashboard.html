{% extends 'base.html' %}{% block body %}<main class="container"><div class="row" style="justify-content:space-between"><div><h1>پروژه‌های من</h1><p class="muted">از پلان معماری DXF تا نقشه‌های برق و مکانیک</p></div></div><div class="card"><h2>پروژه جدید</h2><form method="post" action="/projects"><label>نام پروژه</label><input name="name" placeholder="مثلاً ساختمان مسکونی گنبد" required><button style="margin-top:12px">ایجاد پروژه</button></form></div><div class="grid">{% for p in projects %}<a class="card" href="/projects/{{p.id}}" style="text-decoration:none;color:inherit"><h3>{{p.name}}</h3><span class="badge">{{p.status}}</span><p class="muted">Revision {{p.current_revision}}</p></a>{% else %}<div class="card">هنوز پروژه‌ای ثبت نشده.</div>{% endfor %}</div></main>{% endblock %}
