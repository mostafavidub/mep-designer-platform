name: Runtime Contract Synchronization

on:
  pull_request:
  push:
    branches: [main]

jobs:
  runtime-contract-sync:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - name: Fail closed on runtime, Rule Book, build identity, docs or release-contract drift
        run: python -m cad_engine.runtime_contract_sync_gate
      - name: Positive and destructive runtime-contract regression
        run: python -m pytest -q tests/test_runtime_contract.py tests/test_stage12_site_rulebook_contract.py
