name: Active Version Synchronization

on:
  pull_request:
  push:
    branches: [main]

jobs:
  active-version-sync:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - name: Fail closed on site, engine, Rule Book, docs or release drift
        run: python -m cad_engine.version_sync_gate
      - name: Positive and destructive synchronization regression
        run: python -m pytest -q tests/test_active_version_contract.py tests/test_stage12_site_rulebook_contract.py
