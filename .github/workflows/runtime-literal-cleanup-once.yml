name: Runtime Literal Cleanup One-Time

on:
  push:
    branches:
      - refactor/mechanical-runtime-unversioned-0056

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !startsWith(github.event.head_commit.message, '[literal-cleanup]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/mechanical-runtime-unversioned-0056
          fetch-depth: 0
      - name: Remove final runtime version literal
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('cad_engine/engineering_runner.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace("'version':'engineering-pipeline-v13.17'", "'runtime_identity':'mechanical-pipeline'")
          text = text.replace('"version":"engineering-pipeline-v13.17"', '"runtime_identity":"mechanical-pipeline"')
          if 'pipeline-v13' in text:
              raise SystemExit('pipeline-v13 remains in canonical engineering_runner')
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit final runtime literal cleanup
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cad_engine/engineering_runner.py
          git commit -m '[literal-cleanup] remove final Mechanical runtime version literal'
          git push origin HEAD:refactor/mechanical-runtime-unversioned-0056
