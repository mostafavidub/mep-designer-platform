name: Mechanical Hardening Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  mechanical-hardening:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      DATABASE_URL: sqlite:///./test_ci.db
      DATA_DIR: /tmp/engitools-hardening-data
      CAD_OUTPUT_DIR: /tmp/engitools-hardening-cad
      TMPDIR: /tmp/engitools-hardening-tmp
      MPLBACKEND: Agg
      CAD_DESIGNER_URL: http://127.0.0.1:9999
      PYTHONPATH: .:tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r cad_engine/requirements.txt pytest
      - name: Compile hardened production modules
        run: |
          python -m py_compile \
            app/mechanical_rulebook.py \
            app/mechanical_drawing_set.py \
            app/mechanical_workflow.py \
            cad_engine/system_requirements_v13.py \
            cad_engine/engineering_runner_v13.py \
            cad_engine/authority_architecture_v14.py \
            cad_engine/mechanical_authority_site_v17.py \
            cad_engine/final_delivery_gate_v17.py
      - name: Run project-contract regressions
        run: |
          python -m unittest -v \
            tests.test_authority_architecture_v14 \
            tests.test_final_mechanical_delivery_gate_v17 \
            tests.test_manifest_support_roles_v17 \
            tests.test_mechanical_workflow \
            tests.test_mechanical_minimal_questions \
            tests.test_mechanical_flow_e2e
          python -m pytest -q tests/test_mechanical_drawing_set.py
          python -m pytest -q tests/test_design_recovery.py tests/test_design_progress.py
      - name: Run authority and preservation regressions
        run: |
          python -m pytest -q tests/test_mechanical_authority_v15.py
          python -m unittest -v tests.test_architecture_preservation_gate_v16
          python -m unittest -v tests.test_architecture_preservation_integration_v16
      - name: Run v17 reference and exact-release regressions
        run: |
          python -m unittest -v tests.test_reference_parity_generalization_v17
          python -m unittest -v tests.test_documentation_enhancer_v17
          python -c "from cad_engine.mechanical_release_contract_v17 import release_contract_status; s=release_contract_status(); print(s); assert s['status']=='PASS'"
          python -c "from cad_engine.main_v17 import app; print('main_v17 import PASS')"
