name: SWCIS Governance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  swcis-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve comparison base and unique change request
        id: scope
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          mapfile -t requests < <(git diff --name-only "$base...HEAD" -- 'changes/*.yaml')
          if [[ ${#requests[@]} -ne 1 ]]; then
            echo "Exactly one changed changes/*.yaml file is required; found ${#requests[@]}." >&2
            exit 1
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "request=${requests[0]}" >> "$GITHUB_OUTPUT"
      - name: Validate repository and computed change impact
        run: python tools/swcis_validate.py --base "${{ steps.scope.outputs.base }}" --change-request "${{ steps.scope.outputs.request }}" --report swcis-report.json
      - name: Run governance contract tests
        run: python -m unittest discover -s tests -p 'test_swcis_governance.py' -v
      - name: Publish impact report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swcis-impact-report
          path: swcis-report.json
          if-no-files-found: error
