name: Plan Isolation Acceptance
on:
  pull_request:
    branches: [main]
  push:
    branches: [plan-isolation-v13-12]
jobs:
  plan-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CAD dependency
        run: pip install ezdxf==1.4.2
      - name: Run plan isolation gate
        run: python -m unittest tests.test_plan_isolation_v13 -v
