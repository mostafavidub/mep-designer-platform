name: Web Regression Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATA_DIR: /tmp/engitools-ci-data
      CAD_OUTPUT_DIR: /tmp/engitools-ci-cad
      DATABASE_URL: sqlite:///./test_ci.db
      CAD_DESIGNER_URL: http://127.0.0.1:9999
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install matplotlib pypdf
          mkdir -p "$DATA_DIR" "$CAD_OUTPUT_DIR"
      - name: Run tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
