name: Web Regression Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r cad_engine/requirements.txt
      - name: Run tests
        env:
          DATABASE_URL: sqlite:///./test_ci.db
          DATA_DIR: /tmp/engitools-ci-data
          CAD_OUTPUT_DIR: /tmp/engitools-ci-cad
          TMPDIR: /tmp/engitools-ci-tmp
          MPLBACKEND: Agg
          CAD_DESIGNER_URL: http://127.0.0.1:9999
        run: python -m unittest discover -s tests -p 'test_*.py' -v
