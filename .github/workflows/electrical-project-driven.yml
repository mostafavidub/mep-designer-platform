name: Electrical Project-Driven Tests

on:
  push:
    branches: [feature/electrical-project-driven-v1]
  pull_request:
    branches: [main]

jobs:
  electrical:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: sqlite:///./test_ci.db
      CAD_DESIGNER_URL: http://127.0.0.1:9999
      DATA_DIR: /tmp/engitools-electrical-ci
      CAD_OUTPUT_DIR: /tmp/engitools-electrical-cad
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          mkdir -p "$DATA_DIR" "$CAD_OUTPUT_DIR"
      - name: Run electrical project-driven gates
        run: |
          python -m unittest tests.test_electrical_project_driven_v1 -v
          python -m unittest tests.test_electrical_authority_v15 -v
          python -m unittest tests.test_electrical_release_gate -v
          python -m unittest tests.test_architecture_reconstruction_v1 -v
          python -m unittest tests.test_architecture_topology_v1 -v
          python -m unittest tests.test_level_detection_v3 -v
          python -m unittest tests.test_system_typical_v1 -v
