name: Runtime Unversioning Fix One-Time

on:
  push:
    branches:
      - refactor/mechanical-runtime-unversioned-0056

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !startsWith(github.event.head_commit.message, '[runtime-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/mechanical-runtime-unversioned-0056
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove stale engine-version constant from canonical CAD shell
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('cad_engine/mechanical_cad_shell.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace('from .runtime_contract import MECHANICAL_PIPELINE_VERSION', 'from .build_identity import build_identity')
          text = text.replace("report['version']=MECHANICAL_PIPELINE_VERSION;report['status']='PASS'", "report['build']=build_identity();report['status']='PASS'")
          if 'MECHANICAL_PIPELINE_VERSION' in text:
              raise SystemExit('stale MECHANICAL_PIPELINE_VERSION remains')
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit targeted runtime fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cad_engine/mechanical_cad_shell.py
          git commit -m '[runtime-fix] remove stale Mechanical pipeline version constant'
          git push origin HEAD:refactor/mechanical-runtime-unversioned-0056
