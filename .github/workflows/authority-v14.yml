name: Authority Architecture v14
on:
  pull_request:
    branches: [main]
  push:
    branches: [authority-engine-v14]
jobs:
  authority-v14:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run authority architecture tests
        run: python -m unittest tests.test_authority_architecture_v14 -v
