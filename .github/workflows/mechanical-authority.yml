name: Mechanical Authority

on:
  pull_request:
    paths:
      - 'cad_engine/**'
      - 'app/main_health.py'
      - 'docs/ACTIVE_VERSION_MATRIX.md'
      - 'standards/active-release.json'
      - 'tests/test_active_version_contract.py'
      - 'tests/test_mechanical_authority_v15.py'
      - 'tests/test_mechanical_single_runtime.py'
      - '.github/workflows/mechanical-authority.yml'
  push:
    branches: [main, refactor/mechanical-single-runtime-0055]
    paths:
      - 'cad_engine/**'
      - 'app/main_health.py'
      - 'docs/ACTIVE_VERSION_MATRIX.md'
      - 'standards/active-release.json'
      - 'tests/test_active_version_contract.py'
      - 'tests/test_mechanical_authority_v15.py'
      - 'tests/test_mechanical_single_runtime.py'
      - '.github/workflows/mechanical-authority.yml'

jobs:
  authority:
    runs-on: ubuntu-latest
    env:
      CAD_OUTPUT_DIR: /tmp/cad-engine
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r cad_engine/requirements.txt
      - run: pip install pytest
      - run: python -m py_compile cad_engine/main.py cad_engine/mechanical_authority.py cad_engine/mechanical_pipeline.py cad_engine/mechanical_release_contract.py cad_engine/version_manifest.py
      - run: python -c "import cad_engine.main as m; assert m.mechanical_status()['runtime_identity'] == 'mechanical'"
      - run: python -m pytest -q tests/test_mechanical_authority_v15.py tests/test_active_version_contract.py tests/test_mechanical_single_runtime.py
      - run: docker build -f cad_engine/Dockerfile . -t engitools-cad:test
