name: Runtime Surface Migration One-Time

on:
  push:
    branches:
      - refactor/mechanical-runtime-unversioned-0056

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !startsWith(github.event.head_commit.message, '[surface-migration]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/mechanical-runtime-unversioned-0056
          fetch-depth: 0
      - name: Canonicalize application Rule Book source
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/mechanical_rulebook.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace('from cad_engine.version_manifest import MECHANICAL_RULEBOOK_VERSION', 'from cad_engine.runtime_contract import MECHANICAL_RULEBOOK_REVISION')
          text = text.replace('RULEBOOK_VERSION = MECHANICAL_RULEBOOK_VERSION', 'RULEBOOK_VERSION = MECHANICAL_RULEBOOK_REVISION')
          if 'cad_engine.version_manifest' in text or 'MECHANICAL_RULEBOOK_VERSION' in text:
              raise SystemExit('legacy active version-manifest dependency remains in app/mechanical_rulebook.py')
          p.write_text(text, encoding='utf-8')
          PY
      - name: Create canonical deploy-time Rule Book generator and launcher reference
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path('data/rulebook/generate_rulebook_v4.py')
          dst = Path('data/rulebook/generate_rulebook.py')
          text = src.read_text(encoding='utf-8')
          text = text.replace('from cad_engine.version_manifest import MECHANICAL_RULEBOOK_VERSION', 'from cad_engine.runtime_contract import MECHANICAL_RULEBOOK_REVISION')
          text = text.replace('VERSION = MECHANICAL_RULEBOOK_VERSION', 'VERSION = MECHANICAL_RULEBOOK_REVISION')
          text = text.replace('Generate the production MEP Design Rule Book v5 DOCX.', 'Generate the production MEP Design Rule Book DOCX from the canonical semantic revision.')
          dst.write_text(text, encoding='utf-8')
          start = Path('start_services.sh')
          s = start.read_text(encoding='utf-8').replace('data/rulebook/generate_rulebook_v4.py', 'data/rulebook/generate_rulebook.py')
          if 'generate_rulebook_v' in s:
              raise SystemExit('versioned Rule Book generator remains in production launcher')
          start.write_text(s, encoding='utf-8')
          PY
      - name: Canonicalize remaining Mechanical CI workflow identities
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          migrations = [
              ('.github/workflows/authority-v14.yml', '.github/workflows/authority-architecture.yml', 'Authority Architecture v14', 'Authority Architecture', 'authority-v14:', 'authority-architecture:'),
              ('.github/workflows/architecture-preservation-v16.yml', '.github/workflows/architecture-preservation.yml', 'Architecture Preservation Gate v16', 'Architecture Preservation Gate', None, None),
              ('.github/workflows/reference-parity-generalization-v17.yml', '.github/workflows/reference-parity-generalization.yml', 'Reference Parity Generalization v17', 'Reference Parity Generalization', None, None),
          ]
          for old, new, old_name, new_name, old_job, new_job in migrations:
              op, np = Path(old), Path(new)
              text = op.read_text(encoding='utf-8')
              text = text.replace(f'name: {old_name}', f'name: {new_name}', 1)
              if old_job and new_job:
                  text = text.replace(old_job, new_job, 1)
              text = re.sub(r'push:\n\s+branches:\s*\[[^\]]*v\d+[^\]]*\]', 'push:\n    branches: [main]', text, count=1)
              np.write_text(text, encoding='utf-8')
              op.unlink()
          PY
      - name: Migrate active capability and synchronization contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
              'cad_engine/version_sync_gate.py': 'cad_engine/runtime_contract_sync_gate.py',
              'cad_engine.version_sync_gate': 'cad_engine.runtime_contract_sync_gate',
              'cad_engine/version_manifest.py': 'cad_engine/runtime_contract.py',
              'data/rulebook/generate_rulebook_v4.py': 'data/rulebook/generate_rulebook.py',
              'docs/ACTIVE_VERSION_MATRIX.md': 'docs/RUNTIME_CONTRACT_MATRIX.md',
              '.github/workflows/mechanical-authority-v15.yml': '.github/workflows/mechanical-authority.yml',
              'cad_engine/topology_v13.py': 'cad_engine/topology.py',
              'cad_engine/authority_architecture_v14.py': 'cad_engine/authority_architecture.py',
              'cad_engine/mechanical_authority_v15.py': 'cad_engine/mechanical_design_core.py',
              'cad_engine/engineering_runner_v13.py': 'cad_engine/engineering_runner.py',
              'cad_engine/routing_v13.py': 'cad_engine/routing.py',
              'cad_engine/sizing_v13.py': 'cad_engine/sizing.py',
              'cad_engine/documentation_enhancer_v17.py': 'cad_engine/documentation_enhancer.py',
              'cad_engine/final_delivery_gate_v17.py': 'cad_engine/final_delivery_gate.py',
              'cad_engine/mechanical_release_hardening_v18.py': 'cad_engine/mechanical_release_hardening.py',
              'cad_engine/coordination_v19.py': 'cad_engine/mechanical_coordination.py',
              'cad_engine/manufacturer_selector_v19.py': 'cad_engine/mechanical_manufacturer_selector.py',
              'cad_engine/parametric_documentation_v19.py': 'cad_engine/mechanical_documentation.py',
              'cad_engine/submission_qa_v19.py': 'cad_engine/mechanical_submission_qa.py',
              'cad_engine/mechanical_pipeline_v19.py': 'cad_engine/mechanical_pipeline.py',
              'cad_engine/main_v19.py': 'cad_engine/main.py',
              'cad_engine/mechanical_authority_site_v19.py': 'cad_engine/mechanical_authority.py',
              'cad_engine/main_v15.py': 'cad_engine/main_transport.py',
              'active_version_synchronization': 'runtime_contract_synchronization',
              'production_v19_runtime_authority': 'mechanical_runtime_authority',
              'runtime_version_parity': 'runtime_contract_parity',
          }
          for rel in ('standards/change-impact-matrix.json', 'standards/swcis/change_impact_matrix.yaml', '.github/workflows/mechanical-coordination.yml'):
              p = Path(rel)
              text = p.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  text = text.replace(old, new)
              p.write_text(text, encoding='utf-8')

          registry = Path('standards/capability-registry.json')
          text = registry.read_text(encoding='utf-8')
          capability_replacements = {
              'active_version_synchronization': 'runtime_contract_synchronization',
              'single_version_authority': 'single_runtime_authority',
              'cad_version_parity': 'cad_runtime_contract_parity',
              'test_all_active_site_engine_rulebook_and_release_versions_are_synchronized': 'test_runtime_contract_is_fully_synchronized',
              'test_version_gate_is_destructive_and_detects_release_drift': 'test_contract_gate_detects_entrypoint_drift',
              'production_v19_runtime_authority': 'mechanical_runtime_authority',
              'site_version_stamp': 'build_identity_stamp',
              'v19_authority_before_renderer': 'authority_before_cad_shell',
              'executed_version_response_validation': 'runtime_contract_response_validation',
              'legacy_v17_renderer_only': 'cad_shell_only',
          }
          for old, new in capability_replacements.items():
              text = text.replace(old, new)
          registry.write_text(text, encoding='utf-8')

          test = Path('tests/test_stage12_site_rulebook_contract.py')
          text = test.read_text(encoding='utf-8')
          text = text.replace('def test_stage_12_startup_installs_rulebook_v4_generator_not_legacy_v3_payload(self):', 'def test_stage_12_startup_installs_canonical_rulebook_generator_not_legacy_payload(self):')
          text = text.replace("self.assertIn('generate_rulebook_v4.py', startup)", "self.assertIn('generate_rulebook.py', startup)")
          text = text.replace("self.assertNotIn('MEP_Design_Rulebook_v3.docx.b64', startup)", "self.assertNotIn('MEP_Design_Rulebook_v3.docx.b64', startup)\n        self.assertNotIn('generate_rulebook_v', startup)")
          test.write_text(text, encoding='utf-8')
          PY
      - name: Retire active version-era synchronization surfaces
        run: |
          rm -f .github/workflows/active-version-sync.yml
          rm -f tests/test_active_version_contract.py
          rm -f docs/ACTIVE_VERSION_MATRIX.md
          rm -f cad_engine/version_sync_gate.py
          if grep -R --line-number --exclude='runtime-surface-migration-once.yml' --exclude='contract-changelog.json' --exclude-dir=.git -E 'version_sync_gate|ACTIVE_VERSION_MATRIX|generate_rulebook_v[0-9]+\.py|active_version_synchronization|production_v19_runtime_authority|runtime_version_parity' .; then
            echo 'active version-era synchronization or capability reference remains' >&2
            exit 1
          fi
      - name: Commit canonical runtime and CI surfaces
        run: |
          if [ -z "$(git status --porcelain)" ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '[surface-migration] remove active version-era runtime and CI surfaces'
          git push origin HEAD:refactor/mechanical-runtime-unversioned-0056
