name: Complete Mechanical Runtime Canonicalization

on:
  push:
    branches:
      - refactor/mechanical-runtime-unversioned-0056

permissions:
  contents: write

jobs:
  canonicalize:
    if: ${{ !startsWith(github.event.head_commit.message, '[runtime-unversioning]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/mechanical-runtime-unversioned-0056
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize canonical runtime closure
        run: python tools/complete_mechanical_unversioning.py
      - name: Commit canonical runtime
        run: |
          if git diff --quiet; then
            echo 'No generated runtime changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cad_engine start_services.sh
          git commit -m '[runtime-unversioning] materialize canonical Mechanical runtime'
          git push origin HEAD:refactor/mechanical-runtime-unversioned-0056
