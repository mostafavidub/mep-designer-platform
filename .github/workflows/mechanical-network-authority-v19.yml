name: Mechanical Network Authority v19

on:
  push:
    branches:
      - fix/mechanical-topology-sizing-materialization-0054
  pull_request:
    paths:
      - 'app/project_mechanical_model.py'
      - 'cad_engine/mechanical_authority_site_v19.py'
      - 'cad_engine/mechanical_network_topology.py'
      - 'cad_engine/mechanical_segment_execution.py'
      - 'cad_engine/mechanical_network_materializer.py'
      - 'tests/test_mechanical_authority_runtime_v19.py'
      - 'tests/test_mechanical_network_authority_v19.py'
      - 'tests/test_mechanical_runtime_v19.py'
      - '.github/workflows/mechanical-network-authority-v19.yml'

jobs:
  network-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application and CAD dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest -r requirements.txt -r cad_engine/requirements.txt
      - name: Compile application and CAD engine
        run: python -m compileall -q app cad_engine
      - name: Run focused network authority regressions
        run: python -m unittest -v tests.test_mechanical_network_authority_v19 tests.test_mechanical_authority_runtime_v19 tests.test_mechanical_runtime_v19
      - name: Run full repository unit test suite
        env:
          DATABASE_URL: sqlite:////tmp/engitools-network-authority-ci.db
          DATA_DIR: /tmp/engitools-network-authority-data
          CAD_OUTPUT_DIR: /tmp/engitools-network-authority-cad
          TMPDIR: /tmp/engitools-network-authority-tmp
        run: python -m unittest discover -s tests -v
