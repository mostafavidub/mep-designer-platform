name: Temporary Source Export

on:
  push:
    branches: [tmp-source-export]

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bundle repository
        run: |
          tar -czf /tmp/mep-source.tgz --exclude=.git .
      - uses: actions/upload-artifact@v4
        with:
          name: mep-source-export
          path: /tmp/mep-source.tgz
          retention-days: 1
